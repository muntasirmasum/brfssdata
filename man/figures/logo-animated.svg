<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 1000" role="img" aria-label="brfssdata hex logo: an ECG pulse trace sweeping across a purple hexagon">
  <defs>
    <linearGradient id="hexbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46166b"/>
      <stop offset="1" stop-color="#241040"/>
    </linearGradient>
    <clipPath id="hexclip">
      <path d="M 433 8 L 858 253.5 L 858 746.5 L 433 992 L 8 746.5 L 8 253.5 Z"/>
    </clipPath>
    <radialGradient id="dotglow">
      <stop offset="0" stop-color="#f4ecff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f4ecff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- hexagon body -->
  <path d="M 433 8 L 858 253.5 L 858 746.5 L 433 992 L 8 746.5 L 8 253.5 Z"
        fill="url(#hexbg)"/>

  <!-- faint chart grid, clipped to the hexagon -->
  <g clip-path="url(#hexclip)" stroke="#cbb1e8" stroke-width="2" opacity="0.08">
    <path d="M 0 190 H 866 M 0 330 H 866 M 0 470 H 866 M 0 610 H 866 M 0 750 H 866 M 0 890 H 866"/>
    <path d="M 113 0 V 1000 M 253 0 V 1000 M 393 0 V 1000 M 533 0 V 1000 M 673 0 V 1000 M 813 0 V 1000"/>
  </g>

  <!-- ECG pulse: drawn left to right, then erased behind, indefinitely -->
  <g clip-path="url(#hexclip)">
    <path id="pulse"
          d="M 60 440 L 250 440 L 292 398 L 334 440 L 408 440 L 458 265 L 512 590 L 560 440 L 806 440"
          pathLength="1000" fill="none" stroke="#cbb1e8" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="1000 1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset"
               values="1000;-1000" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- tracing dot leads the line during the draw half, hidden while erasing -->
    <g>
      <circle r="34" fill="url(#dotglow)">
        <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
                       keyPoints="0;1;1" keyTimes="0;0.5;1"
                       path="M 60 440 L 250 440 L 292 398 L 334 440 L 408 440 L 458 265 L 512 590 L 560 440 L 806 440"/>
        <animate attributeName="opacity" values="1;1;0;0"
                 keyTimes="0;0.49;0.5;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="11" fill="#f4ecff">
        <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
                       keyPoints="0;1;1" keyTimes="0;0.5;1"
                       path="M 60 440 L 250 440 L 292 398 L 334 440 L 408 440 L 458 265 L 512 590 L 560 440 L 806 440"/>
        <animate attributeName="opacity" values="1;1;0;0"
                 keyTimes="0;0.49;0.5;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- wordmark -->
  <text x="433" y="712" text-anchor="middle"
        font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="112" font-weight="600" letter-spacing="2"
        fill="#ffffff">brfssdata</text>
  <text x="433" y="800" text-anchor="middle"
        font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="40" font-weight="500" letter-spacing="6"
        fill="#cbb1e8">BRFSS 1985&#8211;2024</text>

  <!-- hexagon border -->
  <path d="M 433 8 L 858 253.5 L 858 746.5 L 433 992 L 8 746.5 L 8 253.5 Z"
        fill="none" stroke="#cbb1e8" stroke-width="14" stroke-linejoin="round"/>
</svg>
