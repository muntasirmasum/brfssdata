url: https://muntasirmasum.github.io/brfssdata/

authors:
  Muntasir Masum:
    href: https://muntasirmasum.com

template:
  bootstrap: 5
  bslib:
    primary: "#46166B"
    link-color: "#46166B"
    base_font:
      google: "IBM Plex Sans"
    heading_font:
      google: "Newsreader"
    code_font:
      google: "IBM Plex Mono"

navbar:
  bg: primary
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Understand the data
      - text: The datasets
        href: articles/datasets.html
      - text: Value labels and missing codes
        href: articles/value-labels-missing-codes.html
      - text: Survey design in BRFSS
        href: articles/survey-design.html
      - text: -------
      - text: Analyze
      - text: Survey-weighted logistic regression
        href: articles/logistic-regression.html
      - text: Age-adjusted prevalence
        href: articles/age-adjustment.html
      - text: Validating against CDC's published estimates
        href: articles/validation.html
      - text: -------
      - text: Combine and export
      - text: Merging BRFSS with external data
        href: articles/external-data.html
      - text: Using the data outside R
        href: articles/outside-r.html

reference:
- title: Read data
  desc: Download-on-demand access to annual BRFSS microdata.
  contents:
  - read_brfss
  - brfss_years
  - brfss_year_info
- title: Survey-weighted analysis
  desc: Design objects with year-appropriate weights, strata, and PSUs.
  contents:
  - brfss_design
  - brfss_std_pop_2000
- title: Find and understand variables
  desc: Search the catalogs, read the codebook, follow renames.
  contents:
  - brfss_vars
  - brfss_codebook
  - brfss_labels
  - brfss_missing_codes
  - brfss_crosswalk
- title: Reference data
  desc: Lookup tables bundled with the package.
  contents:
  - brfss_states
- title: Cite
  desc: Citations for the package and the survey years an analysis used.
  contents:
  - brfss_citation
- title: Cache management
  desc: Prefetch data and inspect, relocate, or clear the local cache.
  contents:
  - brfss_download
  - brfss_cache_dir
  - brfss_cache_info
  - brfss_cache_clear
- title: Package options
  desc: Session options that change caching, design, and check behavior.
  contents:
  - brfssdata-options
